name: Feature request
description: Suggest a focused improvement to Quill Terminal
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What terminal-first workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the smallest useful change and how you would use it.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Primary platform
      options:
        - macOS
        - Windows
        - Linux
        - Cross-platform
    validations:
      required: true

